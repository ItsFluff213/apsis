<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apsis -- KSP Autonomous Fleet Control</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="satellites/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <header class="page-header">
    <h1>Apsis <span id="conn-status" class="bad">connecting...</span></h1>
    <p class="subtitle">Live vessel registry, telemetry, and autopilot control over kRPC.</p>
  </header>

  <div class="profile-bar">
    <label for="profile-select">Save profile:</label>
    <select id="profile-select"></select>
    <input id="profile-new" type="text" placeholder="new profile name" />
    <button id="profile-switch-btn">Switch / Create</button>
    <span class="profile-hint">
      kRPC can't tell which save is loaded -- pick a name per save so
      constellations and roles don't mix between them.
    </span>
  </div>

  <!--
    Tabs are real now: each one owns its own DOM and is mounted into
    #tab-content when selected, then unmounted when you leave it. The
    previous version rendered every control for every tab into every vessel
    card and hid the irrelevant ones with CSS, which is why no part of the
    UI could be separated from the rest.
  -->
  <nav id="tabs" class="tabs">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="orbit">Orbit</button>
    <button class="tab-btn" data-tab="satellites">Satellites</button>
    <button class="tab-btn" data-tab="landing">Landing</button>
    <button class="tab-btn" data-tab="docking">Docking</button>
  </nav>

  <main id="tab-content"></main>

  <script type="module" src="map3d.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
