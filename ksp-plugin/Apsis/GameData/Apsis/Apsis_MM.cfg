// Adds the Role/Stage selector to every part with ModuleCommand (probe
// cores and command pods) -- these are exactly the parts kRPC's
// Parts.controlling returns, which is what backend/vessel_registry.py
// reads for a vessel's role. Requires ModuleManager (near-universal in the
// KSP1 mod ecosystem; declared as a dependency in Apsis.ckan).
@PART[*]:HAS[@MODULE[ModuleCommand]]:FINAL
{
	MODULE
	{
		name = ModuleApsisRole
	}
}
