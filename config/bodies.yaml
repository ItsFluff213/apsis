# Per-celestial-body parking orbit parameters.
# atmosphere_height_m: 0 if the body has no atmosphere.
# min_safe_periapsis_m: lowest periapsis altitude considered safe from decay/impact
#   (for atmospheric bodies this is above the atmosphere; for airless bodies it's
#   above the tallest known terrain plus a margin).
# default_parking_altitude_m: altitude the satellite/station-keeping autopilot
#   targets by default when none is specified.
Kerbin:
  atmosphere_height_m: 70000
  min_safe_periapsis_m: 75000
  default_parking_altitude_m: 100000
Mun:
  atmosphere_height_m: 0
  min_safe_periapsis_m: 10000
  default_parking_altitude_m: 30000
